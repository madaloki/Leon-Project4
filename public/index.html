<!-- Project 4, Problem 1: Two Player Tic Tac Toe (client page) -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Two Player Tic Tac Toe - Michael Leon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Two Player Tic Tac Toe</h1>                       <!-- Title -->
    <h2>Intro to Web Dev, Michael Leon</h2>               <!-- My name -->

    <!-- Login boxes and Join button -->
    <div id="login">
        <input type="text" id="nameBox" placeholder="Name">
        <input type="password" id="passwordBox" placeholder="Password">
        <button id="joinBtn">Join Game</button>
    </div>

    <div id="loggedIn">Not logged in (watching as a spectator)</div>   <!-- Who am I? -->
    <div id="players">X: waiting... | O: waiting...</div>              <!-- Who is playing -->
    <div id="status">Waiting for players</div>                        <!-- Turn / winner -->
    <div id="message"></div>                                          <!-- Error messages -->

    <canvas id="gameCanvas" width="600" height="600">     <!-- Canvas to draw on -->
    </canvas>

    <br>
    <button id="resetBtn">Reset Game</button>             <!-- Reset button -->

    <!-- Socket.IO client library (the server sends this file automatically) -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>                       <!-- My JS code -->
</body>
</html>
